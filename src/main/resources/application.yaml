server:
  port: 8080
  error:
    include-binding-errors: always
    include-message: always
    include-stacktrace: never

spring:
  application:
    name: HotelBookingService

  datasource:
#    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/hotel_booking_db}
    url: jdbc:postgresql://localhost:5432/hotel_booking_db
#    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    username: postgres
#    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: hotel_booking_schema
    hibernate:
#      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
      ddl-auto: validate
      show-sql: false

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml
    drop-first: false
  kafka:
    bootstrap-servers: localhost:9092

  data:
    mongodb:
      uri: mongodb://root:root@localhost:27017/booking_statistic_db?authSource=admin

app:
  kafka:
    booking-statistic-topic: "booking-statistic-topic"
    groupId: "booking-statistic-group"


logging:
  level:
    org.springframework: INFO
    com.example.hotel_booking_service: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
